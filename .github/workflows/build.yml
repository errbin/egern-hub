name: Build and publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
permissions:
  contents: read
concurrency:
  group: production-site
  cancel-in-progress: false
jobs:
  prune-workflow-history:
    name: Keep one previous workflow run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Fetch the public cleanup script by Git
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set +x
          mkdir -p "$RUNNER_TEMP/run-history"
          git init --quiet "$RUNNER_TEMP/run-history"
          git -C "$RUNNER_TEMP/run-history" fetch --quiet --depth=1 "https://github.com/$REPOSITORY.git" "$REVISION"
          git -C "$RUNNER_TEMP/run-history" checkout --quiet --detach FETCH_HEAD
      - name: Remove older completed runs for this workflow
        env:
          ACTIONS_CLEANUP_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/run-history/.github/scripts/prune_workflow_runs.py"

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch this public workflow by Git
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set +x
          mkdir -p "$RUNNER_TEMP/community"
          git init --quiet "$RUNNER_TEMP/community"
          git -C "$RUNNER_TEMP/community" fetch --quiet --depth=1 "https://github.com/$REPOSITORY.git" "$REVISION"
          git -C "$RUNNER_TEMP/community" checkout --quiet --detach FETCH_HEAD
      - name: Check live build logging and private repository redaction
        run: |
          python3 -m unittest discover -s tests -p 'test_run_build.py' -q > "$RUNNER_TEMP/logging-check.log" 2>&1 || {
            cat "$RUNNER_TEMP/logging-check.log"
            exit 1
          }
        working-directory: ${{ runner.temp }}/community
      - name: Fetch private build inputs by Git
        env:
          BUILD_REPOSITORY: ${{ secrets.BUILD_REPOSITORY }}
          BUILD_READ_KEY: ${{ secrets.BUILD_READ_KEY }}
          UPSTREAM_REPOSITORY: ${{ secrets.UPSTREAM_REPOSITORY }}
          UPSTREAM_READ_KEY: ${{ secrets.UPSTREAM_READ_KEY }}
        run: python3 "$RUNNER_TEMP/community/run_build.py" prepare
      - name: Install Python and JavaScript dependencies
        run: |
          set -euo pipefail
          set +x
          python3 -m pip install --quiet --quiet --disable-pip-version-check -r "$RUNNER_TEMP/egernlab-job/runtime/requirements.txt"
          cd "$RUNNER_TEMP/egernlab-job/runtime/tools/js-readability"
          npm ci --ignore-scripts --no-audit --no-fund --silent
          release="$(curl --fail --silent --show-error https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | awk '/linux-x64.tar.xz$/ {print $2; exit}')"
          test -n "$release"
          base="${release%.tar.xz}"
          curl --fail --silent --show-error "https://nodejs.org/dist/latest-v22.x/$release" --output "$RUNNER_TEMP/node22.tar.xz"
          curl --fail --silent --show-error https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | awk -v name="$release" '$2 == name {print $1 "  node22.tar.xz"; found=1; exit} END {if (!found) exit 1}' > "$RUNNER_TEMP/node22.sha256"
          test -s "$RUNNER_TEMP/node22.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check --status node22.sha256)
          mkdir -p "$RUNNER_TEMP/node22"
          tar -xJf "$RUNNER_TEMP/node22.tar.xz" -C "$RUNNER_TEMP/node22" --strip-components=1 "$base"
          echo "$RUNNER_TEMP/node22/bin" >> "$GITHUB_PATH"
      - name: Check the converter's fixed module architecture
        run: |
          python3 -m unittest discover -s tests -p 'test_analysis_architecture.py' -q > "$RUNNER_TEMP/architecture-check.log" 2>&1 || {
            cat "$RUNNER_TEMP/architecture-check.log"
            exit 1
          }
        working-directory: ${{ runner.temp }}/egernlab-job/runtime
      - name: Run tests and build with differential verification
        env:
          BUILD_REPOSITORY: ${{ secrets.BUILD_REPOSITORY }}
          UPSTREAM_REPOSITORY: ${{ secrets.UPSTREAM_REPOSITORY }}
          SITE_REPOSITORY: ${{ secrets.SITE_REPOSITORY }}
        run: python3 "$RUNNER_TEMP/community/run_build.py" build
      - name: Store the upstream snapshot with Git
        env:
          UPSTREAM_REPOSITORY: ${{ secrets.UPSTREAM_REPOSITORY }}
          UPSTREAM_WRITE_KEY: ${{ secrets.UPSTREAM_WRITE_KEY }}
        run: python3 "$RUNNER_TEMP/community/run_build.py" persist-upstream
      - name: Publish to the configured private site repository with Git
        env:
          SITE_REPOSITORY: ${{ secrets.SITE_REPOSITORY }}
          SITE_WRITE_KEY: ${{ secrets.SITE_WRITE_KEY }}
        run: python3 "$RUNNER_TEMP/community/run_build.py" publish
